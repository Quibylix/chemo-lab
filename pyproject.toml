[project]
name = "chemo-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Quibylix", email = "barraza.fredimanuel@gmail.com" }
]
requires-python = ">=3.11, <3.12"
dependencies = [
    "catboost>=1.2.10",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy<2",
    "pandas>=3.0.6",
    "pytdc>=0.4.1",
    "rdkit>=2026.9.1",
    "scikit-learn>=1.9.1",
    "setuptools>=77.0.3,<80",
    "torch>=2.14.1",
]

[project.scripts]
chemo-lab = "chemo_lab:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
